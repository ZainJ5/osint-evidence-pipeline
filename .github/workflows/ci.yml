name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: osint
          POSTGRES_USER: osint
          POSTGRES_PASSWORD: osint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osint -d osint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://osint:osint@localhost:5432/osint
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: snapshots
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Service containers cannot pass `server /data`, so MinIO is started with docker run.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not start" && exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pylint
        run: pylint pipeline --fail-under=9.9

      - name: Dependency direction (QR-09: core must not import adapters or interface)
        run: '! grep -rnE "from pipeline\.(adapters|interface)|import pipeline\.(adapters|interface)" pipeline/core'

      - name: No browser automation (NFR-08)
        run: '! grep -niE "selenium|playwright" pyproject.toml'

      - name: Migrate database
        run: python -m pipeline.adapters.migrate

      - name: Tests with coverage
        run: pytest --cov=pipeline/core --cov-report=term --cov-report=xml --cov-fail-under=60

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
