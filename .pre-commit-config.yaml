# Runs the CI lint and format gates before each commit (CAPA-SA-4).
# Set up once with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # same version as pyproject.toml
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
